<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="title-row">
      <h1 class="game-title">TETRIS</h1>
    </div>
    <label class="theme-switch" title="Cambiar modo claro/oscuro">
      <input type="checkbox" id="theme-toggle" />
      <span class="slider">
        <span class="icon icon-moon">🌙</span>
        <span class="icon icon-sun">☀️</span>
      </span>
    </label>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> <kbd>Esc</kbd> pausa</li>
          </ul>
        </div>

        <div class="panel-section records-section">
          <span class="label">RECORDS</span>
          <ol id="records-list" class="records-list"></ol>
          <div class="records-stats">
            <span>Mejor combo: <strong id="best-combo">0</strong></span>
            <span>Líneas máx: <strong id="max-lines">0</strong></span>
          </div>
          <button id="reset-records-btn" class="reset-records-btn">Resetear records</button>
        </div>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <p id="overlay-stats" class="overlay-stats"></p>

        <div id="new-record-form" class="new-record-form hidden">
          <label for="player-name">¡Nuevo récord! Introduce tu nombre:</label>
          <div class="new-record-row">
            <input type="text" id="player-name" maxlength="12" placeholder="AAA" autocomplete="off" />
            <button id="save-record-btn">Guardar</button>
          </div>
        </div>

        <ol id="overlay-records-list" class="records-list"></ol>

        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>

    <div id="pause-overlay" class="overlay hidden">
      <div class="overlay-box pause-box">
        <div id="pause-menu-view" class="pause-view">
          <p class="pause-title">PAUSA</p>
          <button id="resume-btn" class="menu-btn">Reanudar</button>
          <button id="pause-restart-btn" class="menu-btn">Reiniciar</button>
          <button id="show-controls-btn" class="menu-btn secondary">Ver controles</button>
          <div class="level-select">
            <label for="start-level-select">Nivel inicial</label>
            <select id="start-level-select"></select>
          </div>
        </div>

        <div id="pause-controls-view" class="pause-view hidden">
          <p class="pause-title">CONTROLES</p>
          <ul class="pause-controls-list">
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> <kbd>Esc</kbd> pausa</li>
          </ul>
          <button id="back-btn" class="menu-btn secondary">Volver</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
